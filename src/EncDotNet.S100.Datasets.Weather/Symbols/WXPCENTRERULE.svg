<svg xmlns="http://www.w3.org/2000/svg" version="1.2" width="16mm" height="16mm" viewBox="-8 -8 16 16"><title>WXPCENTRERULE</title><desc>Pressure centre: a cross at the exact centre of a high or low, and the rule under its pressure.</desc><rect class="symbolBox layout" fill="none" x="-8" y="-8" width="16" height="16"/><path id="cross" class="sl f0 sWXFRONT" stroke-width="0.7" d="M -1.5 -1.5 L 1.5 1.5 M 1.5 -1.5 L -1.5 1.5"/><path id="rule" class="sl f0 sWXFRONT" stroke-width="0.45" d="M -6.2 7.3 L 6.2 7.3"/><circle class="pivotPoint layout" fill="none" cx="0" cy="0" r="1"/></svg>
